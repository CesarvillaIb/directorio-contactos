<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Caherengo Seguridad Privada - Directorio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 for Official Brand Icons (WhatsApp, etc) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        caherengo: {
                            bgDark: '#071121',
                            cardDark: '#0b1d3a',
                            borderDark: '#1b3f75',
                            bgLight: '#f8fafc',
                            cardLight: '#ffffff',
                            borderLight: '#e2e8f0',
                            navy: '#0b1d3a',
                            gold: '#d4af37',
                            goldHover: '#b89528'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Ocultar scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilos de Botones */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            transition: transform 0.15s ease, opacity 0.15s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .btn-action:active {
            transform: scale(0.92);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #d4af37 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-caherengo-bgDark text-slate-100 min-h-full transition-colors duration-300 dark:bg-caherengo-bgDark dark:text-slate-100 flex justify-center items-start">

    <div class="w-full max-w-md min-h-screen flex flex-col bg-caherengo-bgDark dark:bg-caherengo-bgDark bg-caherengo-bgLight text-slate-900 dark:text-slate-100 transition-colors duration-300">
        
        <!-- Sticky Header Bar -->
        <header class="sticky top-0 z-40 px-4 pt-4 pb-3 bg-white/90 dark:bg-caherengo-bgDark/95 backdrop-blur-md border-b border-slate-200 dark:border-caherengo-borderDark/60 transition-colors duration-300">
            <!-- Top Logo & Controls Row -->
            <div class="flex items-center justify-between gap-2 mb-3">
                <div class="flex items-center space-x-2.5 min-w-0">
                    <!-- Escudo Caherengo -->
                    <div class="w-10 h-10 rounded-xl bg-caherengo-navy border border-caherengo-gold/40 flex items-center justify-center text-caherengo-gold shrink-0 shadow-md">
                        <i data-lucide="shield-check" class="w-6 h-6"></i>
                    </div>
                    <div class="truncate">
                        <h1 class="text-sm font-extrabold tracking-wider uppercase leading-none dark:text-white text-caherengo-navy">CAHERENGO</h1>
                        <p class="text-[10px] font-bold text-caherengo-gold uppercase tracking-wider leading-tight mt-0.5">SEGURIDAD PRIVADA</p>
                    </div>
                </div>

                <!-- Theme Switcher & Counter -->
                <div class="flex items-center space-x-2 shrink-0">
                    <button id="theme-btn" onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-caherengo-cardDark border border-slate-300 dark:border-caherengo-borderDark flex items-center justify-center text-amber-500 active:scale-95 transition-all shadow-sm">
                        <i data-lucide="sun" id="theme-icon" class="w-4 h-4"></i>
                    </button>
                    <div class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-caherengo-cardDark border border-slate-300 dark:border-caherengo-borderDark text-[11px] font-extrabold text-caherengo-gold shadow-sm">
                        <span id="contact-count">12</span>
                    </div>
                </div>
            </div>

            <!-- Subtitle Label -->
            <div class="mb-3 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-caherengo-cardDark border border-slate-200 dark:border-caherengo-borderDark/50 flex items-center space-x-2 text-[11px] text-slate-600 dark:text-slate-300">
                <i data-lucide="radio-receiver" class="w-3.5 h-3.5 text-caherengo-gold shrink-0"></i>
                <span class="truncate font-medium">Directorio Operativo de Contactos / Control</span>
            </div>

            <!-- Search Bar -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Buscar área, personal o número..." 
                    class="w-full pl-9 pr-9 py-2.5 bg-slate-100 dark:bg-caherengo-cardDark text-slate-900 dark:text-slate-100 placeholder-slate-400 rounded-xl text-xs font-semibold border border-slate-300 dark:border-caherengo-borderDark focus:outline-none focus:ring-2 focus:ring-caherengo-gold transition-all shadow-inner"
                />
                <button id="clear-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400">
                    <i data-lucide="x-circle" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Categories Chips -->
            <div class="flex space-x-2 mt-3 overflow-x-auto no-scrollbar text-xs font-bold">
                <button onclick="filterCategory('ALL', this)" class="cat-chip active px-3.5 py-1.5 rounded-xl bg-caherengo-gold text-slate-900 shadow-sm whitespace-nowrap transition-all">Todos</button>
                <button onclick="filterCategory('MONITOREO', this)" class="cat-chip px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-caherengo-cardDark border border-slate-200 dark:border-caherengo-borderDark text-slate-600 dark:text-slate-300 whitespace-nowrap transition-all">Monitoreo</button>
                <button onclick="filterCategory('RRHH', this)" class="cat-chip px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-caherengo-cardDark border border-slate-200 dark:border-caherengo-borderDark text-slate-600 dark:text-slate-300 whitespace-nowrap transition-all">RRHH</button>
                <button onclick="filterCategory('OPERACIONES', this)" class="cat-chip px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-caherengo-cardDark border border-slate-200 dark:border-caherengo-borderDark text-slate-600 dark:text-slate-300 whitespace-nowrap transition-all">Operaciones</button>
            </div>
        </header>

        <!-- Contacts Scroll Area -->
        <main class="flex-1 p-3.5 space-y-3 no-scrollbar pb-8" id="contacts-container">
            <!-- Dynamically Populated -->
        </main>

        <!-- Empty Results -->
        <div id="no-results" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center my-auto">
            <div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-caherengo-cardDark border border-slate-300 dark:border-caherengo-borderDark flex items-center justify-center text-slate-400 mb-3">
                <i data-lucide="shield-alert" class="w-6 h-6 text-amber-500"></i>
            </div>
            <p class="font-bold text-sm">Contacto no encontrado</p>
            <p class="text-xs text-slate-400 mt-1">Verifique el término de búsqueda.</p>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/95 dark:bg-caherengo-navy/95 text-white border border-caherengo-gold/50 text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2 z-50 backdrop-blur-md">
            <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
            <span id="toast-msg">Número copiado</span>
        </div>

    </div>

    <script>
        // Official Contact Data
        const contacts = [
            { id: 1, name: "MONITOREO BRAVO, DELTA Y CHARLY", phone: "33 3400 5492", raw: "523334005492", category: "MONITOREO", icon: "shield" },
            { id: 2, name: "MONITOREO GOLF, ECO Y LIMA", phone: "33 1844 7329", raw: "523318447329", category: "MONITOREO", icon: "radio" },
            { id: 3, name: "MONITOREO OMEGA, SIGMA Y ALFA", phone: "33 2833 0182", raw: "523328330182", category: "MONITOREO", icon: "eye" },
            { id: 4, name: "LÍDER DE MONITOREO, Julieta", phone: "33 3454 6535", raw: "523334546535", category: "MONITOREO", icon: "user-check" },
            { id: 5, name: "VACACIONES / ASISTENCIAS / FINIQUITOS", phone: "33 3201 6865", raw: "523332016865", category: "RRHH", icon: "calendar" },
            { id: 6, name: "DIRECTOR RECURSOS HUMANOS", phone: "33 3201 0449", raw: "523332010449", category: "RRHH", icon: "briefcase" },
            { id: 7, name: "RECLUTAMIENTO", phone: "33 1865 8787", raw: "523318658787", category: "RRHH", icon: "user-plus" },
            { id: 8, name: "RECURSOS HUMANOS", phone: "33 1248 4767", raw: "523312484767", category: "RRHH", icon: "users" },
            { id: 9, name: "RECURSOS HUMANOS TLJ", phone: "33 2834 5225", raw: "523328345225", category: "RRHH", icon: "building" },
            { id: 10, name: "RECLUTAMIENTO", phone: "33 1186 9575", raw: "523311869575", category: "RRHH", icon: "user-search" },
            { id: 11, name: "ALMACÉN", phone: "33 1865 8784", raw: "523318658784", category: "OPERACIONES", icon: "box" },
            { id: 12, name: "CABINA", phone: "33 1865 8783", raw: "523318658783", category: "OPERACIONES", icon: "headphones" }
        ];

        let favorites = JSON.parse(localStorage.getItem('caherengo_favs') || '[]');
        let currentCat = 'ALL';
        let searchQuery = '';
        let isDarkMode = true;

        const container = document.getElementById('contacts-container');
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-btn');
        const noResults = document.getElementById('no-results');
        const contactCount = document.getElementById('contact-count');

        function render() {
            container.innerHTML = '';

            let filtered = contacts.filter(c => {
                const matchCat = currentCat === 'ALL' || c.category === currentCat;
                const matchSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    c.phone.replace(/\s+/g, '').includes(searchQuery.replace(/\s+/g, ''));
                return matchCat && matchSearch;
            });

            // Reordenar Favoritos arriba
            filtered.sort((a, b) => {
                const aFav = favorites.includes(a.id);
                const bFav = favorites.includes(b.id);
                return (bFav ? 1 : 0) - (aFav ? 1 : 0);
            });

            contactCount.textContent = filtered.length;
            noResults.classList.toggle('hidden', filtered.length > 0);

            filtered.forEach(c => {
                const isFav = favorites.includes(c.id);
                const card = document.createElement('div');
                
                // Estilos adaptados Modo Día (blanco) vs Modo Noche (azul oscuro)
                card.className = `p-3.5 rounded-2xl bg-white dark:bg-caherengo-cardDark border border-slate-200 dark:border-caherengo-borderDark/80 shadow-sm transition-all`;

                card.innerHTML = `
                    <!-- Encabezado de la Tarjeta con Puesto Completo -->
                    <div class="flex items-start justify-between gap-2 mb-3">
                        <div class="flex items-start space-x-2.5 min-w-0 flex-1">
                            <div class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-caherengo-bgDark border border-slate-200 dark:border-caherengo-borderDark text-caherengo-gold flex items-center justify-center shrink-0 mt-0.5">
                                <i data-lucide="${c.icon}" class="w-4 h-4"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <span class="inline-block px-2 py-0.5 text-[9px] font-extrabold rounded bg-caherengo-gold/20 text-amber-600 dark:text-caherengo-gold uppercase tracking-wider mb-1">
                                    ${c.category}
                                </span>
                                <!-- Nombre/Puesto sin truncar, visible completo en 2 o más líneas -->
                                <h2 class="font-extrabold text-xs text-slate-800 dark:text-slate-100 leading-normal break-words pr-1">${c.name}</h2>
                            </div>
                        </div>

                        <!-- Botón Favoritos -->
                        <button onclick="toggleFav(${c.id})" class="p-1.5 text-slate-300 dark:text-slate-600 hover:text-amber-400 active:scale-90 transition-all shrink-0 -mt-1 -mr-1">
                            <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>
                        </button>
                    </div>

                    <!-- Fila de Acciones Móviles con Número en Una Sola Línea -->
                    <div class="flex items-center justify-between pt-2.5 border-t border-slate-100 dark:border-caherengo-borderDark/50 gap-2">
                        <!-- Botón copiar número - Garantizado en 1 Sola Línea (whitespace-nowrap) -->
                        <button onclick="copyPhone('${c.phone}')" class="flex items-center justify-center space-x-1.5 px-2.5 py-2.5 rounded-xl bg-slate-100 dark:bg-caherengo-bgDark border border-slate-200 dark:border-caherengo-borderDark text-slate-700 dark:text-slate-200 font-mono text-xs font-bold active:scale-95 transition-all whitespace-nowrap flex-1 min-w-0">
                            <i data-lucide="copy" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                            <span class="whitespace-nowrap tracking-tight">${c.phone}</span>
                        </button>

                        <!-- Botones directos para teléfono -->
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <!-- Llamada directa -->
                            <a href="tel:+${c.raw}" class="btn-action bg-blue-600 text-white" title="Llamar">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                            </a>

                            <!-- SMS -->
                            <a href="sms:+${c.raw}" class="btn-action bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200" title="SMS">
                                <i data-lucide="message-square" class="w-4 h-4"></i>
                            </a>

                            <!-- WhatsApp Oficial Directo a la App -->
                            <a href="https://api.whatsapp.com/send?phone=${c.raw}" target="_blank" class="btn-action bg-[#25D366] text-white" title="WhatsApp">
                                <i class="fa-brands fa-whatsapp text-lg"></i>
                            </a>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function filterCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.cat-chip').forEach(b => {
                b.className = "cat-chip px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-caherengo-cardDark border border-slate-200 dark:border-caherengo-borderDark text-slate-600 dark:text-slate-300 whitespace-nowrap transition-all";
            });
            btn.className = "cat-chip active px-3.5 py-1.5 rounded-xl bg-caherengo-gold text-slate-900 font-bold shadow-sm whitespace-nowrap transition-all";
            render();
        }

        function toggleFav(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
                showToast("Quitado de favoritos");
            } else {
                favorites.push(id);
                showToast("Agregado a favoritos ⭐");
            }
            localStorage.setItem('caherengo_favs', JSON.stringify(favorites));
            render();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearBtn.classList.toggle('hidden', searchQuery.length === 0);
            render();
        });

        function clearSearch() {
            searchInput.value = '';
            searchQuery = '';
            clearBtn.classList.add('hidden');
            render();
        }

        function copyPhone(num) {
            const temp = document.createElement('input');
            temp.value = num;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast(`Número ${num} copiado`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // Alternador Día (Blanco) / Noche (Azul Oscuro)
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const html = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');

            if (isDarkMode) {
                html.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                html.classList.remove('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        window.onload = function() {
            lucide.createIcons();
            render();
        }
    </script>
</body>
</html>
